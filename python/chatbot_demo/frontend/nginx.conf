server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA. Unknown paths fall back to index.html so client-side
    # routing / reloads work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend service on the compose network.
    # No URI on proxy_pass, so the full /api/... path is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream chat responses incrementally: disable nginx's response
        # buffering so NDJSON tokens reach the browser as they arrive rather
        # than being held back. (The backend also sends X-Accel-Buffering: no.)
        proxy_buffering off;
        proxy_cache off;
        # The chat stream is long-lived; don't cut it off early.
        proxy_read_timeout 300s;
    }
}
